# INT4 AWQ, 100% visual tokens, eager (unfused) attention
name: E0_eager_r100
model_id: Qwen/Qwen2.5-VL-3B-Instruct-AWQ
quantization: awq-int4
attention_backend: eager
token_method: none
token_retention: 1.0
