# INT4 AWQ, VisionZip 50% visual tokens, SDPA
name: C2_sdpa_r50
model_id: Qwen/Qwen2.5-VL-3B-Instruct-AWQ
quantization: awq-int4
attention_backend: sdpa
token_method: visionzip
token_retention: 0.5
contextual_ratio: 0.05      # VisionZip contextual tokens = 5% of all visual tokens (reference setting)
min_pixels: 200704          # 256 * 28 * 28
max_pixels: 802816          # 1024 * 28 * 28 -> at most 1024 visual tokens per image
max_new_tokens: 32
warmup: 5
seed: 1234
